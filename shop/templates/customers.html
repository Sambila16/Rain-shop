{% extends 'base.html' %}{% block content %}<h2>Regular customers</h2>
<div class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Add customer</button></form></div>
<table><tr><th>Name</th><th>Phone</th><th>Location</th></tr>{% for c in items %}<tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.location }}</td></tr>{% empty %}<tr><td colspan="3">No customers yet.</td></tr>{% endfor %}</table>{% endblock %}
